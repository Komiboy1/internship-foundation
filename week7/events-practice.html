<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Event Listeners Practice</title>

        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
                margin-top: 40px;
                transition: 0.5s;
            }

            button{
                padding: 10px 20px;
                margin: 10px;
                cursor: pointer;
            }

            input{
                padding: 10px;
                width: 250px;
            }
        </style>
    </head>

    <body>
        <h1 id="heading">JavaScript Event Listeners</h1>

        <button id="changeHeading">
            Change Heading
        </button>

        <br><br>

        <input
        id="nameInput"
        type="text"
        placeholder="Type something...">

        <p>Open the browser console to see the typed text.</p>

        <button id="changeColor">
            Change Background
        </button>

        <p id="hoverText">
            Hover your mouse over this text
        </p>

        <script src="script.js"></script>
    </body>
</html>
