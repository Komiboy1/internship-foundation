<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Search</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            max-width:700px;
            margin:40px auto;
            text-align:center;
        }

        input{
            padding:10px;
            width:250px;
        }

        button{
            padding:10px 20px;
            margin-left:10px;
            cursor:pointer;
        }

        #result{
            margin-top:30px;
            border:1px solid #ddd;
            padding:20px;
        }

        img{
            width:150px;
            margin-top:15px;
        }
    </style>

</head>
<body>

<h1>Country Search</h1>

<input
type="text"
id="countryInput"
placeholder="Enter a country name">

<button id="searchBtn">
Search
</button>

<div id="result">
Enter a country name and click Search.
</div>

<script src="api.js"></script>

</body>
</html>
